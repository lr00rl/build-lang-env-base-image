[package]
name = "rust-base-warmup"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]
resolver = "3"

# Direct versions are copied from dagentic's Cargo.lock. `cargo generate-lockfile`
# on unpinned ranges drifted (serde 1.0.229 vs 1.0.228) and those rlibs would
# not be reused. The committed Cargo.lock is the reachable subset of
# dagentic's lock, not a fresh resolve. After a dagentic lock bump, rebuild
# that subset rather than running generate-lockfile.

# Direct versions are copied from dagentic's Cargo.lock. cargo generate-lockfile
# on unpinned "1" / "0.4" ranges drifted (serde 1.0.229 vs dagentic 1.0.228)
# and those rlibs would not be reused. Run `make rust-lock` after a dagentic
# lock bump, then rebuild rust-base.
#
# rust-base cargo-builds this package into /opt/rust-cache when PRECOMPILE=auto
# and the image arch is native, so a service cargo build can reuse the rlibs.
# Skip that step under QEMU (PRECOMPILE=auto and BUILDARCH != TARGETARCH).

[dependencies]
anyhow = "=1.0.103"
async-trait = "=0.1.89"
arrow-array = "=58.3.0"
arrow-arith = "=58.3.0"
arrow-buffer = "=58.3.0"
arrow-cast = "=58.3.0"
arrow-data = "=58.3.0"
arrow-json = "=58.3.0"
arrow-schema = "=58.3.0"
arrow-select = "=58.3.0"
axum = "=0.8.9"
bytes = "=1.12.0"
http = "=1.4.2"
percent-encoding = "=2.3.2"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "=4.6.1", features = ["derive"] }
datafusion = { version = "=54.1.0", default-features = true }
datafusion-common = "=54.1.0"
dotenvy = "=0.15.7"
futures = "=0.3.32"
hex = "=0.4.3"
object_store = { version = "=0.13.2", features = ["aws"] }
quick-xml = { version = "=0.39.4", features = ["serialize"] }
parquet = { version = "=58.3.0", features = ["arrow", "async", "object_store"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
serde_yaml = "=0.9.34"
sha2 = "=0.10.9"
sqlparser = { version = "=0.62.0", features = ["visitor"] }
subtle = "=2.6.1"
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread", "fs", "signal"] }
tower-http = { version = "=0.6.11", features = ["trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
url = "=2.5.8"
uuid = { version = "=1.23.4", features = ["v4", "serde"] }
zstd = "=0.13.3"
