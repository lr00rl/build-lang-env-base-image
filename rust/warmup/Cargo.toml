[package]
name = "rust-base-warmup"
version = "0.0.0"
edition = "2021"
publish = false

# The data-query stack this org actually compiles (dagentic, and anything
# else that sits on DataFusion + Arrow + object_store). cargo fetch of this
# graph is baked into rust-base so a cold Jenkins agent does not sit on
# crates.io for the same hundreds of crates every build.
#
# Top-level versions are pinned to dagentic's Cargo.lock. Run `make rust-lock`
# after changing this file. Do not cargo build here: a multi-arch rust-push
# would compile DataFusion under QEMU on the foreign half, which is the
# slowness this image exists to avoid.

[dependencies]
anyhow = "1"
async-trait = "0.1"
arrow-array = "=58.3.0"
arrow-cast = "=58.3.0"
arrow-json = "=58.3.0"
arrow-schema = "=58.3.0"
arrow-select = "=58.3.0"
axum = "=0.8.9"
bytes = "1"
http = "1"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
datafusion = { version = "=54.1.0", default-features = true }
datafusion-common = "=54.1.0"
dotenvy = "0.15"
futures = "0.3"
hex = "0.4"
object_store = { version = "=0.13.2", features = ["aws"] }
quick-xml = { version = "=0.39.4", features = ["serialize"] }
parquet = { version = "=58.3.0", features = ["arrow", "async", "object_store"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sqlparser = { version = "=0.62", features = ["visitor"] }
subtle = "2.6"
tokio = { version = "=1.52.3", features = ["macros", "rt-multi-thread", "fs", "signal"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zstd = "=0.13.3"
